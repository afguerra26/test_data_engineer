services:

  # ──────────────────────────────────────────────
  # 1) Base de datos de METADATA de Airflow (esta SÍ sigue local)
  # ──────────────────────────────────────────────
  postgres-airflow:
    image: postgres:15
    container_name: postgres_airflow_meta
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # 2) Inicialización de Airflow:
  #    - migra metadata de Airflow
  #    - crea usuario admin
  #    - registra Airflow Variables
  #    - crea la BD del DW (remota) y aplica el DDL si no existen
  # ──────────────────────────────────────────────
  airflow-init:
    build: .
    container_name: airflow_init
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_POSTGRES_DW: postgresql://${DW_DB_USER}:${DW_DB_PASSWORD}@${DW_HOST}:${DW_PORT}/${DW_DB_NAME}
      DW_HOST: ${DW_HOST}
      DW_PORT: ${DW_PORT}
      DW_DB_USER: ${DW_DB_USER}
      DW_DB_PASSWORD: ${DW_DB_PASSWORD}
      DW_DB_NAME: ${DW_DB_NAME}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}
      DW_FX_RATE_USD: ${DW_FX_RATE_USD}
      DW_DEFAULT_COUNTRY: ${DW_DEFAULT_COUNTRY}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config:ro
      - ./scripts:/opt/airflow/scripts:ro
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --firstname ${AIRFLOW_ADMIN_FIRSTNAME}
        --lastname ${AIRFLOW_ADMIN_LASTNAME}
        --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL}
        --password ${AIRFLOW_ADMIN_PASSWORD} &&
        airflow variables set dw_fx_rate_usd "${DW_FX_RATE_USD}" &&
        airflow variables set dw_default_country "${DW_DEFAULT_COUNTRY}" &&
        python /opt/airflow/scripts/init_dw.py

  # ──────────────────────────────────────────────
  # 3) Webserver
  # ──────────────────────────────────────────────
  airflow-webserver:
    build: .
    container_name: airflow_webserver
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    ports:
      - "8080:8080"
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config:ro
      - ./scripts:/opt/airflow/scripts:ro
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────
  # 4) Scheduler
  # ──────────────────────────────────────────────
  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config:ro
      - ./scripts:/opt/airflow/scripts:ro
    command: scheduler

volumes:
  postgres_airflow_data: